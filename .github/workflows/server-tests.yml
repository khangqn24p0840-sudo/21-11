name: ScamShield server tests
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server-tests.yml'
  pull_request:
    paths:
      - 'server/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install backend dependencies
        working-directory: server
        run: python -m pip install -r requirements.txt
      - name: Compile backend and run all tests
        working-directory: server
        env:
          PYTHONPATH: .
          AI_PROVIDER: gemini
          GROQ_API_KEY: ''
          GEMINI_API_KEY: ''
          OPENROUTER_API_KEY: ''
          ADMIN_KEY: ''
          NEWS_ENABLED: 'false'
          DATA_DIR: /tmp/scamshield-ci-data
          DB_PATH: /tmp/scamshield-ci-data/tests.db
          SECRET_KEY: scamshield-ci-only-secret-with-at-least-32-bytes
        run: |
          python -m py_compile server.py tests/test_ai_timeouts.py tests/test_conversation_monitor.py tests/test_family_chat.py
          python -m unittest discover -s tests -v
