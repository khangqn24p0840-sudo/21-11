name: Apply and test packaged ScamShield server
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-server.yml'
      - 'apply_server_fixes.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract only source files needed for patch and tests
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          required = [
              "server/server.py",
              "server/chay.ps1",
              "server/README.md",
              "server/requirements.txt",
              "server/tests/test_conversation_monitor.py",
              "server/tests/test_family_chat.py",
          ]
          with ZipFile("server.zip") as archive:
              names = set(archive.namelist())
              missing = [name for name in required if name not in names]
              if missing:
                  raise SystemExit("Missing files in server.zip: " + ", ".join(missing))
              for name in required:
                  target = Path(name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(name))
          print("Extracted source/test files only. .env files and databases were not extracted.")
          PY
      - name: Apply backend fixes
        run: python apply_server_fixes.py
      - name: Install test dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Compile and run regression suite
        env:
          PYTHONPATH: server
          AI_PROVIDER: gemini
          GROQ_API_KEY: ''
          GEMINI_API_KEY: ''
          OPENROUTER_API_KEY: ''
          ADMIN_KEY: ''
          NEWS_ENABLED: 'false'
          DATA_DIR: /tmp/scamshield-ci-data
          DB_PATH: /tmp/scamshield-ci-data/tests.db
          SECRET_KEY: scamshield-ci-only-secret
        run: |
          python -m py_compile server/server.py server/tests/test_ai_timeouts.py
          python -m unittest discover -s server/tests -v
      - name: Replace only patched source entries in the original ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          archive_path = Path("server.zip")
          temp_path = Path("server-updated.zip")
          replacements = {
              "server/server.py": Path("server/server.py").read_bytes(),
              "server/chay.ps1": Path("server/chay.ps1").read_bytes(),
              "server/README.md": Path("server/README.md").read_bytes(),
              "server/tests/test_ai_timeouts.py": Path("server/tests/test_ai_timeouts.py").read_bytes(),
          }
          with ZipFile(archive_path, "r") as original, ZipFile(temp_path, "w", ZIP_DEFLATED) as updated:
              original_names = set(original.namelist())
              for info in original.infolist():
                  if info.is_dir():
                      updated.writestr(info, b"")
                      continue
                  data = original.read(info.filename)
                  if info.filename == "server/.env.example":
                      text = data.decode("utf-8")
                      lines = text.splitlines()
                      found_groq = False
                      found_gemini = False
                      for index, line in enumerate(lines):
                          if line.strip().startswith("GROQ_TIMEOUT_SECONDS="):
                              lines[index] = "GROQ_TIMEOUT_SECONDS=45"
                              found_groq = True
                          if line.strip().startswith("GEMINI_TIMEOUT_SECONDS="):
                              lines[index] = "GEMINI_TIMEOUT_SECONDS=15"
                              found_gemini = True
                      if not found_groq:
                          lines.append("GROQ_TIMEOUT_SECONDS=45")
                      if not found_gemini:
                          lines.append("GEMINI_TIMEOUT_SECONDS=15")
                      data = ("\n".join(lines).rstrip() + "\n").encode("utf-8")
                  if info.filename in replacements:
                      data = replacements[info.filename]
                  updated.writestr(info, data)
              for name, data in replacements.items():
                  if name not in original_names:
                      updated.writestr(name, data)
          temp_path.replace(archive_path)
          with ZipFile(archive_path) as check:
              names = set(check.namelist())
              for required in replacements:
                  if required not in names:
                      raise SystemExit("Updated archive missing: " + required)
          print("Updated original ZIP; unrelated archive entries were copied without extraction.")
          PY
      - name: Remove temporary extracted sources
        run: rm -rf server
      - name: Commit updated server archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.zip
          if git diff --cached --quiet; then
            echo "server.zip already contains the fixes."
          else
            git commit -m "fix: align AI timeouts with Android client"
            git push
          fi
